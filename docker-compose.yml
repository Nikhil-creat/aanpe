services:
  dashboard:
    build: .
    ports: ["7860:7860"]
    deploy: {resources: {reservations: {devices: [{capabilities: [gpu]}]}}}
  api:
    build: .
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    deploy: {resources: {reservations: {devices: [{capabilities: [gpu]}]}}}
